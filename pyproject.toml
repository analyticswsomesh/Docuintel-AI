[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuintel-ai"
version = "0.1.0"
description = "Local-first document intelligence and workflow automation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "streamlit>=1.39,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
ai = ["chromadb>=0.5,<1.0", "sentence-transformers>=3.0,<6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
